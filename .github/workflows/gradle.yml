name: Kotlin and Android
on:
  push:
    paths: ["shared/**", "apps/android/**", "*.gradle.kts", "gradle.properties", ".github/workflows/gradle.yml"]
  pull_request:
    paths: ["shared/**", "apps/android/**", "*.gradle.kts", "gradle.properties", ".github/workflows/gradle.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12"
      # Pin a stable command-line tools release. The runner's preinstalled SDK
      # was a preview build; setup-android tried installing the removed legacy
      # "tools" package and exited before Gradle could run.
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "11076708"
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0
          accept-android-sdk-licenses: true
      - name: Verify Android SDK
        run: |
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
      - name: Run shared tests and build Android debug APK
        run: gradle --no-daemon :shared:allTests :apps:android:assembleDebug
