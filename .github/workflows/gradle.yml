name: Kotlin and Android
on:
  push:
    paths: ["shared/**", "apps/android/**", "apps/ios/**", "*.gradle.kts", "gradle.properties", ".github/workflows/**"]
  pull_request:
    paths: ["shared/**", "apps/android/**", "*.gradle.kts", "gradle.properties", ".github/workflows/gradle.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12"

      # Override setup-android's default legacy "tools" package, which no
      # longer exists in Google's SDK repository. Install required packages below.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android SDK components and accept licenses
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verify Android SDK installation
        shell: bash
        run: |
          set -euo pipefail
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

      - name: Run shared tests and build Android debug APK
        run: gradle --no-daemon :shared:allTests :apps:android:assembleDebug

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sahaara-android-debug-apk
          path: apps/android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
