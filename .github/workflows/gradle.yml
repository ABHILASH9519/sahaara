name: Kotlin and Android
on:
  push:
    paths: ["shared/**", "apps/android/**", "*.gradle.kts", "gradle.properties", ".github/workflows/gradle.yml"]
  pull_request:
    paths: ["shared/**", "apps/android/**", "*.gradle.kts", "gradle.properties", ".github/workflows/gradle.yml"]
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12"
      - uses: android-actions/setup-android@v3
      - run: gradle :shared:allTests :apps:android:assembleDebug
