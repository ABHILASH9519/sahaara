name: Kotlin and Android
on:
  push:
    paths: ["shared/**", "apps/android/**", "*.gradle.kts", "gradle.properties", ".github/workflows/gradle.yml"]
  pull_request:
    paths: ["shared/**", "apps/android/**", "*.gradle.kts", "gradle.properties", ".github/workflows/gradle.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            cmdline-tools;latest
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Run shared tests and build Android debug APK
        run: gradle --no-daemon :shared:allTests :apps:android:assembleDebug
