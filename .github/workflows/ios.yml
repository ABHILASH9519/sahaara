name: iOS build
on:
  push:
    paths: ["apps/ios/**", "apps/android/**", "shared/**", ".github/workflows/**"]
  pull_request:
    paths: ["apps/ios/**", "apps/android/**", "shared/**", ".github/workflows/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate --spec apps/ios/project.yml --project apps/ios
      - name: Build iOS Simulator app
        run: xcodebuild -project apps/ios/Sahaara.xcodeproj -scheme Sahaara -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
