name: Go API
on:
  push:
    paths: ["backend/**", ".github/workflows/go.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/go.yml"]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: backend/go.mod
      - name: Verify Go formatting
        run: test -z "$(gofmt -l .)"
      - name: Run race-enabled tests
        run: go test -race ./...
      - run: go vet ./...
      - run: go build ./cmd/api
